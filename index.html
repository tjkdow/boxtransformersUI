<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Rig: Top-Tab Stable Master</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        
        /* Top Navigation UI */
        #top-nav { position: absolute; top: 0; left: 0; width: 100%; height: 50px; background: #111; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #333; z-index: 200; gap: 10px; }
        .tab { padding: 8px 20px; font-size: 11px; font-weight: bold; cursor: pointer; background: #222; border: 1px solid #444; border-radius: 4px; color: #888; transition: 0.2s; }
        .tab.active { background: #00ffff; color: #000; border-color: #00ffff; }

        /* Floating Controls UI */
        #controls { position: absolute; left: 20px; top: 70px; width: 240px; background: rgba(15, 15, 15, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #333; z-index: 100; }
        
        #bone-label { font-size: 16px; font-weight: bold; color: #00ffff; display: block; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        label { display: block; font-size: 9px; color: #666; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        input[type=range] { width: 100%; cursor: pointer; margin-bottom: 2px; accent-color: #00ffff; }
        
        .box-settings { margin-top: 15px; padding-top: 15px; border-top: 1px solid #333; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        input[type=number] { width: 100%; background: #000; color: #00ffff; border: 1px solid #444; font-size: 11px; padding: 5px; border-radius: 3px; box-sizing: border-box; }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 10px; cursor: pointer; background: #222; color: white; border: 1px solid #444; border-radius: 4px; font-size: 10px; font-weight: bold; }
        button:hover { background: #333; }
        .add-btn { background: #1b5e20; border-color: #2e7d32; }
        .del-btn { background: #b71c1c; border-color: #d32f2f; }
        .export-btn { position: absolute; bottom: 20px; right: 20px; background: #f9a825; color: black; border: none; padding: 12px 25px; }
    </style>
</head>
<body>

<div id="top-nav">
    <div class="tab active" id="tab-rigA" onclick="switchRig('rigA')">HUMANOID A</div>
    <div class="tab" id="tab-rigB" onclick="switchRig('rigB')">HUMANOID B</div>
    <div class="tab" id="tab-veh" onclick="switchRig('veh')">VEHICLE</div>
</div>

<div id="controls">
    <span id="bone-label">Root</span>

    <label>Swing X</label><input type="range" id="rotX" min="-3.14" max="3.14" step="0.01" value="0">
    <label>Swing Z</label><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.01" value="0">
    <label>Twist Y</label><input type="range" id="rotY" min="-3.14" max="3.14" step="0.01" value="0">

    <div id="box-ui" style="display:none;" class="box-settings">
        <label>Scale (X/Y/Z)</label>
        <div class="input-row">
            <input type="number" id="scaX" step="0.1" value="1">
            <input type="number" id="scaY" step="0.1" value="1">
            <input type="number" id="scaZ" step="0.1" value="1">
        </div>
        <label>Offset (X/Y/Z)</label>
        <div class="input-row">
            <input type="number" id="posX" step="0.1" value="0">
            <input type="number" id="posY" step="0.1" value="0">
            <input type="number" id="posZ" step="0.1" value="0">
        </div>
    </div>
    
    <div class="btn-row">
        <button class="add-btn" onclick="addBox()">ADD BOX</button>
        <button class="del-btn" onclick="deleteSelected()">DELETE</button>
    </div>
</div>

<button class="export-btn" onclick="exportData()">EXPORT CURRENT JSON</button>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';

    const BLUEPRINT = {
        "Root": { p: null, l: 0, d: [0,0,0] },
        "Pelvis": { p: "Root", l: 0, d: [0,0,0], offset: [0, 2.05, 0] },
        "Spine": { p: "Root", l: 0.8, d: [0,1,0], offset: [0, 2.05, 0] },
        "Chest": { p: "Spine", l: 0.7, d: [0,1,0] },
        "Head": { p: "Chest", l: 0.5, d: [0,1,0] },
        "L_Arm": { p: "Chest", l: 0.7, d: [1,0,0] },
        "R_Arm": { p: "Chest", l: 0.7, d: [-1,0,0] },
        "L_Thigh": { p: "Pelvis", l: 1.1, d: [0.3,-1,0] },
        "R_Thigh": { p: "Pelvis", l: 1.1, d: [-0.3,-1,0] },
        "L_Calf": { p: "L_Thigh", l: 0.9, d: [0,-1,0] },
        "R_Calf": { p: "R_Thigh", l: 0.9, d: [0,-1,0] }
    };

    const DATA = {
        rigA: { pose: {}, armor: [] },
        rigB: { pose: {}, armor: [] },
        veh:  { pose: {}, armor: [] }
    };

    const init = (r) => Object.keys(BLUEPRINT).forEach(b => r.pose[b] = { rot:[0,0,0], pos:[0,0,0], sca:[1,1,1] });
    init(DATA.rigA); init(DATA.rigB); init(DATA.veh);

    let current = 'rigA', selected = "Root", pivots = {}, clickables = [];
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(6, 4, 8);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    new OrbitControls(camera, renderer.domElement);

    function sync() {
        const boxes = JSON.parse(JSON.stringify(DATA.rigA.armor));
        ['rigB', 'veh'].forEach(k => {
            DATA[k].armor = boxes;
            boxes.forEach(b => { if(!DATA[k].pose[b.id]) DATA[k].pose[b.id] = {rot:[0,0,0], pos:[0,0,0], sca:[1,1,1]}; });
        });
    }

    window.switchRig = (id) => {
        current = id;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${id}`).classList.add('active');
        rebuild();
    };

    function rebuild() {
        while(scene.children.length > 0) scene.remove(scene.children[0]);
        scene.add(new THREE.GridHelper(12, 24, 0x333333, 0x222222));
        pivots = {}; clickables = [];

        Object.keys(BLUEPRINT).forEach(name => {
            const pivot = new THREE.Group();
            pivot.name = name; pivots[name] = pivot;
            const cfg = BLUEPRINT[name];
            const dot = new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshBasicMaterial());
            dot.userData.id = name; pivot.add(dot); clickables.push(dot);

            if (!cfg.p) scene.add(pivot);
            else {
                const parent = pivots[cfg.p];
                if (cfg.offset) pivot.position.set(...cfg.offset);
                else pivot.position.set(BLUEPRINT[cfg.p].d[0]*BLUEPRINT[cfg.p].l, BLUEPRINT[cfg.p].d[1]*BLUEPRINT[cfg.p].l, BLUEPRINT[cfg.p].d[2]*BLUEPRINT[cfg.p].l);
                parent.add(pivot);
            }
        });

        DATA[current].armor.forEach(b => {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshBasicMaterial({wireframe:true}));
            mesh.userData.id = b.id; mesh.userData.isBox = true;
            pivots[b.parentId].add(mesh); pivots[b.id] = mesh; clickables.push(mesh);
        });
        update();
    }

    function update() {
        const p = DATA[current].pose[selected];
        document.getElementById('bone-label').innerText = selected;
        document.getElementById('box-ui').style.display = selected.startsWith("Box") ? "block" : "none";
        ['rotX','rotY','rotZ'].forEach((id, i) => document.getElementById(id).value = p.rot[i]);
        if(selected.startsWith("Box")) {
            ['X','Y','Z'].forEach((a, i) => {
                document.getElementById('pos'+a).value = p.pos[i];
                document.getElementById('sca'+a).value = p.sca[i];
            });
        }
        Object.keys(pivots).forEach(id => {
            const piv = pivots[id], d = DATA[current].pose[id];
            piv.quaternion.set(0,0,0,1);
            piv.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), d.rot[0]));
            piv.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), d.rot[1]));
            piv.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), d.rot[2]));
            if(piv.userData.isBox) { piv.position.set(...d.pos); piv.scale.set(...d.sca); }
            piv.traverse(c => { if(c.isMesh) c.material.color.set(id === selected ? 0xffff00 : (c.userData.isBox ? 0x00ffbb : 0x555555)); });
        });
    }

    window.addBox = () => {
        if(current !== 'rigA') return;
        const id = "Box_" + Math.random().toString(36).substr(2, 4).toUpperCase();
        DATA.rigA.armor.push({ id, parentId: selected });
        DATA.rigA.pose[id] = { rot:[0,0,0], pos:[0,0,0], sca:[1,1,1] };
        sync(); rebuild(); selected = id; update();
    };

    window.deleteSelected = () => {
        if (!selected.startsWith("Box") || current !== 'rigA') return;
        DATA.rigA.armor = DATA.rigA.armor.filter(b => b.id !== selected);
        sync(); selected = "Root"; rebuild();
    };

    const bind = (id, fn) => document.getElementById(id).oninput = (e) => { fn(parseFloat(e.target.value)); update(); };
    bind('rotX', v => DATA[current].pose[selected].rot[0] = v);
    bind('rotY', v => DATA[current].pose[selected].rot[1] = v);
    bind('rotZ', v => DATA[current].pose[selected].rot[2] = v);
    ['X','Y','Z'].forEach((a, i) => {
        bind('pos'+a, v => DATA[current].pose[selected].pos[i] = v);
        bind('sca'+a, v => DATA[current].pose[selected].sca[i] = v);
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
        const m = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const ray = new THREE.Raycaster(); ray.setFromCamera(m, camera);
        const hit = ray.intersectObjects(clickables)[0];
        if (hit) { selected = hit.object.userData.id; update(); }
    });

    rebuild();
    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
