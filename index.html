<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mecha Builder: Pro Rig</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        #nav-bar { position: absolute; top: 0; width: 100%; display: flex; background: #111; z-index: 200; border-bottom: 1px solid #333; height: 44px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; text-transform: uppercase; color: #666; border-right: 1px solid #222; }
        .tab.active { color: #00ffff; background: #1a1a1a; border-bottom: 2px solid #00ffff; }

        #ui-panel { position: absolute; right: 10px; top: 55px; width: 200px; background: rgba(15, 15, 15, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #444; z-index: 150; }
        #bone-label { font-size: 14px; font-weight: bold; color: #00ffff; display: block; margin-bottom: 10px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 5px;}
        label { display: block; font-size: 9px; color: #888; margin-top: 8px; text-transform: uppercase; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #00ffff; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
        .btn { width: 100%; padding: 8px; cursor: pointer; background: #222; color: white; border: 1px solid #444; border-radius: 4px; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        
        #build-controls { position: absolute; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 150; }
        .build-btn { padding: 12px 20px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        #map-status { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); color: #ffcc00; font-weight: bold; display: none; background: rgba(0,0,0,0.8); padding: 5px 15px; border-radius: 20px; border: 1px solid #ffcc00; z-index: 100;}
    </style>
</head>
<body>

<div id="nav-bar">
    <div id="tab-v" class="tab active" onclick="setTab('vehicle')">Build Vehicle</div>
    <div id="tab-h" class="tab" onclick="setTab('humanoid')">Pose Humanoid</div>
    <div id="tab-t" class="tab" onclick="setTab('transform')">Transform</div>
</div>

<div id="map-status">MAPPING MODE: SELECT BOXES FOR <span id="target-map-name">NONE</span></div>

<div id="ui-panel">
    <div id="pose-header" style="display:none;">
        <label>Active Joint</label>
        <span id="bone-label">Root</span>
    </div>
    
    <div id="pose-controls" style="display:none;">
        <label>Swing X (Front/Back)</label><input type="range" id="rotX" min="-3.14" max="3.14" step="0.01" value="0">
        <label>Twist Y</label><input type="range" id="rotY" min="-3.14" max="3.14" step="0.01" value="0">
        <label>Swing Z (Side/Side)</label><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.01" value="0">
        <div class="btn-group">
            <button class="btn" onclick="mirrorPose('L','R')">L→R</button>
            <button class="btn" onclick="mirrorPose('R','L')">R→L</button>
        </div>
    </div>

    <div id="box-controls">
        <label id="mapping-info">Mapped to: Chest</label>
        <label>Width</label><input type="range" id="sx" min="0.1" max="4" step="0.1" value="1">
        <label>Height</label><input type="range" id="sy" min="0.1" max="4" step="0.1" value="1">
        <label>Length</label><input type="range" id="sz" min="0.1" max="4" step="0.1" value="1">
        <button class="btn" style="margin-top:10px; background:#b71c1c;" onclick="deleteBox()">Delete Box</button>
    </div>
</div>

<div id="build-controls">
    <button class="build-btn" style="background:#2e7d32; color:white;" onclick="addBox()">+ Add Box</button>
    <button class="build-btn" style="background:#ff8f00; color:white;" id="map-btn">Map to Selected Bone</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';

    const config = {
        "Root": { p: null, l: 0, d: [0,0,0] },
        "Pelvis": { p: "Root", l: 0, d: [0,0,0], offset: [0, 2.05, 0] },
        "Spine": { p: "Root", l: 0.8, d: [0,1,0], offset: [0, 2.05, 0] },
        "Pelvis_L": { p: "Pelvis", l: 0.3, d: [1,0,0] },
        "Pelvis_R": { p: "Pelvis", l: 0.3, d: [-1,0,0] },
        "Chest": { p: "Spine", l: 0.7, d: [0,1,0] },
        "Neck": { p: "Chest", l: 0.2, d: [0,1,0] },
        "Head": { p: "Neck", l: 0.4, d: [0,1,0] },
        "L_Arm": { p: "Chest", l: 0.7, d: [1,0,0] },
        "L_Forearm": { p: "L_Arm", l: 0.6, d: [1,0,0] },
        "R_Arm": { p: "Chest", l: 0.7, d: [-1,0,0] },
        "R_Forearm": { p: "R_Arm", l: 0.6, d: [-1,0,0] },
        "L_Thigh": { p: "Pelvis_L", l: 1.1, d: [0,-1,0] },
        "L_Calf": { p: "L_Thigh", l: 0.9, d: [0,-1,0] },
        "L_Foot": { p: "L_Calf", l: 0.4, d: [0,0,1] },
        "R_Thigh": { p: "Pelvis_R", l: 1.1, d: [0,-1,0] },
        "R_Calf": { p: "R_Thigh", l: 0.9, d: [0,-1,0] },
        "R_Foot": { p: "R_Calf", l: 0.4, d: [0,0,1] }
    };

    let scene, camera, renderer, controls, raycaster;
    let parts = [], pivots = {}, clickables = [];
    let currentPose = Object.fromEntries(Object.keys(config).map(n => [n, [0,0,0]]));
    let selectedBone = "Root", activeBox = null;
    let currentTab = 'vehicle', morphT = 0, morphTarget = 0;
    let isMapping = false;

    init();
    animate();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(6, 4, 8);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        raycaster = new THREE.Raycaster();

        scene.add(new THREE.GridHelper(10, 20, 0x333333, 0x222222));
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dLight.position.set(5,10,5);
        scene.add(dLight);

        Object.keys(config).forEach(name => {
            const pivot = new THREE.Group();
            pivot.name = name;
            pivots[name] = pivot;

            const dot = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0xffffff}));
            dot.userData.boneName = name;
            pivot.add(dot);
            clickables.push(dot);

            if (config[name].p) pivots[config[name].p].add(pivot);
            else scene.add(pivot);

            if (config[name].offset) pivot.position.set(...config[name].offset);
            else if (config[name].p) {
                const pData = config[config[name].p];
                pivot.position.set(pData.d[0]*pData.l, pData.d[1]*pData.l, pData.d[2]*pData.l);
            }

            if (config[name].l > 0) {
                // RESTORED: Grey Bone Cylinder
                const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, config[name].l, 6), new THREE.MeshBasicMaterial({color: 0x555555}));
                mesh.position.set(config[name].d[0]*config[name].l/2, config[name].d[1]*config[name].l/2, config[name].d[2]*config[name].l/2);
                if(config[name].d[0] !== 0) mesh.rotation.z = Math.PI/2;
                if(config[name].d[2] !== 0) mesh.rotation.x = Math.PI/2;
                pivot.add(mesh);

                // RESTORED: Normals (Cyan Fins)
                const fin = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.1, 0.03), new THREE.MeshBasicMaterial({color: 0x00ffff}));
                fin.position.copy(mesh.position);
                if (config[name].d[1] !== 0) fin.position.z += 0.05; 
                else if (config[name].d[0] !== 0) fin.position.y += 0.05;
                pivot.add(fin);
            }
        });

        window.addEventListener('pointerdown', onPointerDown);
        document.getElementById('map-btn').onclick = () => {
            isMapping = true;
            document.getElementById('map-status').style.display = 'block';
            document.getElementById('target-map-name').innerText = selectedBone;
        };

        setupInputs();
        addBox();
    }

    function addBox() {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        mesh.position.set((Math.random()-0.5)*2, 1, (Math.random()-0.5)*2);
        mesh.userData = { startPos: new THREE.Vector3(), startScale: new THREE.Vector3(1,1,1), targetBone: "Chest" };
        scene.add(mesh);
        parts.push(mesh);
        setActiveBox(mesh);
    }

    function setActiveBox(mesh) {
        if (activeBox) activeBox.material.emissive.setHex(0x000000);
        activeBox = mesh;
        activeBox.material.emissive.setHex(0x333333);
        document.getElementById('mapping-info').innerText = "Mapped to: " + mesh.userData.targetBone;
        ['sx','sy','sz'].forEach(id => document.getElementById(id).value = mesh.scale[id.charAt(1)]);
    }

    function setupInputs() {
        ['rotX', 'rotY', 'rotZ'].forEach((id, axis) => {
            document.getElementById(id).oninput = (e) => { currentPose[selectedBone][axis] = parseFloat(e.target.value); };
        });
        ['sx','sy','sz'].forEach(id => {
            document.getElementById(id).oninput = (e) => { if (activeBox) activeBox.scale[id.charAt(1)] = parseFloat(e.target.value); };
        });
    }

    window.setTab = (tab) => {
        currentTab = tab;
        isMapping = false;
        document.getElementById('map-status').style.display = 'none';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${tab.charAt(0)}`).classList.add('active');
        
        document.getElementById('build-controls').style.display = (tab === 'vehicle') ? 'flex' : 'none';
        document.getElementById('pose-controls').style.display = (tab === 'humanoid') ? 'block' : 'none';
        document.getElementById('pose-header').style.display = (tab === 'humanoid') ? 'block' : 'none';
        document.getElementById('box-controls').style.display = (tab === 'vehicle') ? 'block' : 'none';

        morphTarget = (tab === 'transform') ? 1 : 0;
        if (tab === 'transform') parts.forEach(p => { p.userData.startPos.copy(p.position); p.userData.startScale.copy(p.scale); });
    };

    window.deleteBox = () => {
        if (!activeBox) return;
        scene.remove(activeBox);
        parts = parts.filter(p => p !== activeBox);
        activeBox = parts[0] || null;
        if(activeBox) setActiveBox(activeBox);
    };

    window.mirrorPose = (from, to) => {
        Object.keys(currentPose).forEach(name => {
            let target = null;
            if (name.includes(`_${from}`)) target = name.replace(`_${from}`, `_${to}`);
            else if (name.startsWith(`${from}_`)) target = name.replace(`${from}_`, `${to}_`);
            if (target && currentPose[target]) {
                const src = currentPose[name];
                // Mirror logic: Invert Twist (Y) and Side Swing (Z) to keep symmetry forward
                currentPose[target] = [src[0], -src[1], -src[2]];
                if (selectedBone === target) {
                    ['rotX', 'rotY', 'rotZ'].forEach((id, i) => document.getElementById(id).value = currentPose[target][i]);
                }
            }
        });
    };

    function onPointerDown(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        raycaster.setFromCamera(mouse, camera);
        
        const hitPart = raycaster.intersectObjects(parts)[0];
        if (hitPart && currentTab !== 'humanoid') { 
            setActiveBox(hitPart.object); 
            if (isMapping) {
                hitPart.object.userData.targetBone = selectedBone;
                isMapping = false;
                document.getElementById('map-status').style.display = 'none';
                document.getElementById('mapping-info').innerText = "Mapped to: " + selectedBone;
            }
            return; 
        }

        const hitBone = raycaster.intersectObjects(clickables)[0];
        if (hitBone) { 
            selectedBone = hitBone.object.userData.boneName;
            document.getElementById('bone-label').innerText = selectedBone;
            ['rotX', 'rotY', 'rotZ'].forEach((id, i) => document.getElementById(id).value = currentPose[selectedBone][i]);
            if (isMapping) document.getElementById('target-map-name').innerText = selectedBone;
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        morphT = THREE.MathUtils.lerp(morphT, morphTarget, 0.1);

        Object.keys(pivots).forEach(name => {
            const pivot = pivots[name];
            const [x, y, z] = currentPose[name];
            const boneDir = new THREE.Vector3().fromArray(config[name].d).normalize();
            
            pivot.quaternion.set(0, 0, 0, 1);
            pivot.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), z));
            let swingAxis = (Math.abs(boneDir.y) > 0.5 || name === "Root" || name === "Spine") ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
            pivot.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(swingAxis, x));
            pivot.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(boneDir.length() === 0 ? new THREE.Vector3(0,1,0) : boneDir, y));

            pivot.visible = (currentTab !== 'transform'); 
            pivot.children[0].material.color.set(name === selectedBone ? 0x00ffff : 0xffffff);
        });

        const worldPos = new THREE.Vector3();
        parts.forEach(p => {
            const bone = pivots[p.userData.targetBone || "Chest"];
            bone.updateMatrixWorld();
            worldPos.setFromMatrixPosition(bone.matrixWorld);
            p.position.lerpVectors(p.userData.startPos, worldPos, morphT);
            
            // Auto-scale during transform
            const l = config[p.userData.targetBone || "Chest"].l || 0.5;
            const targetScale = new THREE.Vector3(l*0.4, l, l*0.4);
            p.scale.lerpVectors(p.userData.startScale, targetScale, morphT);
            p.quaternion.slerp(bone.getWorldQuaternion(new THREE.Quaternion()), morphT);

            // CRITICAL: Hide boxes in Humanoid tab
            p.visible = (currentTab !== 'humanoid');
        });

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
