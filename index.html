<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mecha Lab: Vehicle Rig & Mirror</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        #nav-bar { position: absolute; top: 0; width: 100%; display: flex; background: #111; z-index: 200; border-bottom: 1px solid #333; height: 40px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; text-transform: uppercase; color: #666; border-right: 1px solid #222; transition: 0.2s; }
        .tab.active { color: #00ffff; background: #1a1a1a; border-bottom: 2px solid #00ffff; }

        #ui { position: absolute; right: 10px; top: 50px; width: 220px; background: rgba(15, 15, 15, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #444; z-index: 100; }
        #bone-label { font-size: 16px; font-weight: bold; color: #00ffff; display: block; margin-bottom: 10px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 5px;}
        label { display: block; font-size: 10px; color: #888; margin-top: 8px; text-transform: uppercase; }
        input[type=range] { width: 100%; cursor: pointer; margin-bottom: 4px; accent-color: #00ffff; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
        button { width: 100%; padding: 8px; cursor: pointer; background: #222; color: white; border: 1px solid #444; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        button:hover { background: #333; }
        .active-tool { background: #004d40; border-color: #00ffff; }
        .toggle-on { color: #00ffff; border-color: #00ffff; }
        
        #vehicle-footer { position: absolute; bottom: 20px; left: 20px; z-index: 150; display: flex; gap: 10px; }
        .build-btn { padding: 12px 20px; background: #2e7d32; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="nav-bar">
    <div id="tab-v" class="tab active" onclick="changeTab('vehicle')">Vehicle Tab</div>
    <div id="tab-h" class="tab" onclick="changeTab('humanoid')">Humanoid Tab</div>
</div>

<div id="ui">
    <div id="pane-humanoid" style="display:none;">
        <label>Active Joint</label>
        <span id="bone-label">Root</span>
        <label>Swing X</label><input type="range" id="rotX" min="-3.14" max="3.14" step="0.01" value="0">
        <label>Swing Z</label><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.01" value="0">
        <label>Local Twist</label><input type="range" id="rotY" min="-3.14" max="3.14" step="0.01" value="0">
        <div class="btn-group">
            <button onclick="window.mirrorPose('L','R')">L → R</button>
            <button onclick="window.mirrorPose('R','L')">R → L</button>
        </div>
    </div>

    <div id="pane-vehicle">
        <label id="part-label" style="color:#00ffff; text-align:center; font-weight:bold;">No Selection</label>
        
        <label>Gizmo Mode</label>
        <div class="btn-group">
            <button id="btn-translate" class="active-tool" onclick="setGizmoMode('translate')">Move</button>
            <button id="btn-rotate" onclick="setGizmoMode('rotate')">Rotate</button>
        </div>

        <label>Toggles</label>
        <div class="btn-group">
            <button id="btn-mirror" onclick="toggleMirror()">Mirror Off</button>
            <button id="btn-rig-toggle" onclick="toggleRigVisibility()">Rig Hide</button>
        </div>

        <label>Manual Scale W/H/D</label>
        <input type="range" id="sx" min="0.1" max="5" step="0.1" value="1">
        <input type="range" id="sy" min="0.1" max="5" step="0.1" value="1">
        <input type="range" id="sz" min="0.1" max="5" step="0.1" value="1">

        <button onclick="window.deleteBox()" style="background:#b71c1c; margin-top:15px; border:none;">Delete Selected</button>
    </div>
</div>

<div id="vehicle-footer">
    <button class="build-btn" onclick="window.addBox()">+ Add Box</button>
    <button class="build-btn" style="background:#4527a0;" onclick="window.cloneRigToVehicle()">+ Clone Rig</button>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
            "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
            "gizmo": "https://unpkg.com/three@0.160.0/examples/jsm/controls/TransformControls.js"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';
    import { TransformControls } from 'gizmo';

    const config = {
        "Root": { p: null, l: 0, d: [0,0,0] }, 
        "Pelvis": { p: "Root", l: 0, d: [0,0,0], offset: [0, 2.05, 0] }, 
        "Spine": { p: "Root", l: 0.8, d: [0,1,0], offset: [0, 2.05, 0] }, 
        "Pelvis_L": { p: "Pelvis", l: 0.3, d: [1,0,0] }, "Pelvis_R": { p: "Pelvis", l: 0.3, d: [-1,0,0] },
        "Chest": { p: "Spine", l: 0.7, d: [0,1,0] }, "Neck": { p: "Chest", l: 0.2, d: [0,1,0] }, "Head": { p: "Neck", l: 0.4, d: [0,1,0] },
        "L_Arm": { p: "Chest", l: 0.7, d: [1,0,0] }, "L_Forearm": { p: "L_Arm", l: 0.6, d: [1,0,0] }, "L_Hand": { p: "L_Forearm", l: 0.3, d: [1,0,0] },
        "R_Arm": { p: "Chest", l: 0.7, d: [-1,0,0] }, "R_Forearm": { p: "R_Arm", l: 0.6, d: [-1,0,0] }, "R_Hand": { p: "R_Forearm", l: 0.3, d: [-1,0,0] },
        "L_Thigh": { p: "Pelvis_L", l: 1.1, d: [0,-1,0] }, "L_Calf": { p: "L_Thigh", l: 0.9, d: [0,-1,0] }, "L_Foot": { p: "L_Calf", l: 0.25, d: [0,0,1] }, 
        "R_Thigh": { p: "Pelvis_R", l: 1.1, d: [0,-1,0] }, "R_Calf": { p: "R_Thigh", l: 0.9, d: [0,-1,0] }, "R_Foot": { p: "R_Calf", l: 0.25, d: [0,0,1] }
    };

    let pose = Object.fromEntries(Object.keys(config).map(n => [n, [0,0,0]]));
    let selectedBone = "Root", currentTab = 'vehicle', activeBox = null, boxes = [];
    let mirrorEnabled = false, rigVisibleInVehicle = false;
    const pivots = {}, clickables = [], vehicleRigs = [];

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(4, 2, 6);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    const transformGizmo = new TransformControls(camera, renderer.domElement);
    scene.add(new THREE.GridHelper(10, 20, 0x333333, 0x222222));
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(5,10,5); scene.add(dl);
    scene.add(transformGizmo);

    transformGizmo.addEventListener('dragging-changed', (e) => { controls.enabled = !e.value; });
    
    transformGizmo.addEventListener('change', () => {
        if (activeBox && mirrorEnabled && transformGizmo.dragging) {
            const m = activeBox.userData.mirror;
            if (m) {
                m.position.set(-activeBox.position.x, activeBox.position.y, activeBox.position.z);
                m.rotation.set(activeBox.rotation.x, -activeBox.rotation.y, -activeBox.rotation.z);
            }
        }
    });

    function createRig(isMain = true) {
        const rigGroup = new THREE.Group();
        const localPivots = {};
        Object.keys(config).forEach(name => {
            const pivot = new THREE.Group();
            localPivots[name] = pivot;
            const isRoot = name === "Root";
            let geom = isRoot ? new THREE.CylinderGeometry(0.2, 0.2, 0.01, 32) : new THREE.SphereGeometry(0.04);
            const dot = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({color: isMain ? 0xffffff : 0x666666}));
            dot.userData.boneName = name; pivot.add(dot);
            if (isMain) clickables.push(dot);

            if (isRoot) rigGroup.add(pivot);
            else {
                const cfg = config[name];
                const parentPivot = localPivots[cfg.p];
                if (cfg.offset) pivot.position.set(...cfg.offset);
                else pivot.position.set(config[cfg.p].d[0]*config[cfg.p].l, config[cfg.p].d[1]*config[cfg.p].l, config[cfg.p].d[2]*config[cfg.p].l);
                parentPivot.add(pivot);
                if (cfg.l > 0) {
                    const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, cfg.l, 6), new THREE.MeshBasicMaterial({color: 0x999999}));
                    bone.position.set(cfg.d[0]*cfg.l/2, cfg.d[1]*cfg.l/2, cfg.d[2]*cfg.l/2);
                    if(cfg.d[0] !== 0) bone.rotation.z = Math.PI/2; else if(cfg.d[2] !== 0) bone.rotation.x = Math.PI/2;
                    pivot.add(bone);
                    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.1, 0.03), new THREE.MeshBasicMaterial({color: 0x00ffff}));
                    fin.position.copy(bone.position);
                    if (name.includes("Foot")) fin.position.y += 0.04; else { fin.position.z += 0.04; fin.rotation.x = Math.PI/2; }
                    pivot.add(fin);
                }
            }
        });
        return { group: rigGroup, pivots: localPivots };
    }

    const mainRig = createRig(true);
    Object.assign(pivots, mainRig.pivots);
    scene.add(mainRig.group);

    window.addBox = () => {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshPhongMaterial({ color: 0x444444 }));
        mesh.position.set(mirrorEnabled ? 1.5 : 0, 0.5, 0);
        scene.add(mesh); boxes.push(mesh);
        if (mirrorEnabled) {
            const m = new THREE.Mesh(mesh.geometry, mesh.material);
            m.position.set(-mesh.position.x, mesh.position.y, mesh.position.z);
            scene.add(m); boxes.push(m);
            mesh.userData.mirror = m; m.userData.mirror = mesh;
        }
        setActiveBox(mesh);
    };

    window.cloneRigToVehicle = () => {
        const clone = createRig(false);
        clone.group.position.x = vehicleRigs.length + 2;
        scene.add(clone.group);
        vehicleRigs.push(clone);
        updateApp();
    };

    function setActiveBox(mesh) {
        activeBox = mesh;
        transformGizmo.attach(mesh);
        document.getElementById('part-label').innerText = "Box Selected";
    }

    window.toggleMirror = () => {
        mirrorEnabled = !mirrorEnabled;
        const btn = document.getElementById('btn-mirror');
        btn.innerText = mirrorEnabled ? "Mirror On" : "Mirror Off";
        btn.classList.toggle('toggle-on', mirrorEnabled);
    };

    window.toggleRigVisibility = () => {
        rigVisibleInVehicle = !rigVisibleInVehicle;
        const btn = document.getElementById('btn-rig-toggle');
        btn.innerText = rigVisibleInVehicle ? "Rig Show" : "Rig Hide";
        btn.classList.toggle('toggle-on', rigVisibleInVehicle);
        updateApp();
    };

    window.setGizmoMode = (m) => {
        transformGizmo.setMode(m);
        document.getElementById('btn-translate').classList.toggle('active-tool', m === 'translate');
        document.getElementById('btn-rotate').classList.toggle('active-tool', m === 'rotate');
    };

    function updateApp() {
        mainRig.group.visible = (currentTab === 'humanoid' || rigVisibleInVehicle);
        vehicleRigs.forEach(r => r.group.visible = (currentTab === 'vehicle'));
        boxes.forEach(b => b.visible = (currentTab === 'vehicle'));
        
        Object.keys(pivots).forEach(name => {
            const p = pivots[name];
            const [x, y, z] = pose[name];
            const d = new THREE.Vector3().fromArray(config[name].d).normalize();
            p.quaternion.set(0,0,0,1);
            p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), z));
            let sAxis = (Math.abs(d.y) > 0.5 || name === "Root" || name === "Spine") ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
            p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(sAxis, x));
            p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(d.length() === 0 ? new THREE.Vector3(0,1,0) : d, y));
            p.traverse(c => { if(c.isMesh && c.userData.boneName) c.material.color.set(name === selectedBone ? 0xffff00 : 0xffffff); });
        });

        if (currentTab === 'humanoid') transformGizmo.detach();
        else if (activeBox) transformGizmo.attach(activeBox);
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
        if (transformGizmo.dragging) return;
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        if (currentTab === 'vehicle') {
            const hit = raycaster.intersectObjects(boxes)[0];
            if (hit) setActiveBox(hit.object);
            else { activeBox = null; transformGizmo.detach(); }
        } else {
            const hit = raycaster.intersectObjects(clickables)[0];
            if (hit) { selectedBone = hit.object.userData.boneName; updateApp(); }
        }
    });

    window.changeTab = (t) => {
        currentTab = t;
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + t.charAt(0)).classList.add('active');
        document.getElementById('pane-vehicle').style.display = (t === 'vehicle') ? 'block' : 'none';
        document.getElementById('pane-humanoid').style.display = (t === 'humanoid') ? 'block' : 'none';
        document.getElementById('vehicle-footer').style.display = (t === 'vehicle') ? 'flex' : 'none';
        updateApp();
    };

    updateApp();
    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
