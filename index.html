<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Rig: Vehicle Variant & Precision Armor</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        #ui { position: absolute; right: 10px; top: 10px; width: 260px; background: rgba(15, 15, 15, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #444; z-index: 100; max-height: 90vh; overflow-y: auto; }
        
        .tabs { display: flex; gap: 2px; margin-bottom: 15px; background: #222; border-radius: 4px; padding: 2px; }
        .tab { flex: 1; padding: 8px; font-size: 10px; text-align: center; cursor: pointer; background: #333; border-radius: 2px; font-weight: bold; }
        .tab.active { background: #00ffff; color: #000; }

        #bone-label { font-size: 14px; font-weight: bold; color: #00ffff; display: block; margin-bottom: 10px; }
        label { display: block; font-size: 10px; color: #888; margin-top: 8px; text-transform: uppercase; }
        
        .control-row { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
        input[type=range] { flex-grow: 1; accent-color: #00ffff; }
        input[type=number] { width: 50px; background: #222; color: #00ffff; border: 1px solid #444; font-size: 10px; padding: 2px; border-radius: 2px; }

        .transform-section { margin-top: 15px; padding-top: 10px; border-top: 1px solid #333; display: none; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
        button { width: 100%; padding: 8px; cursor: pointer; background: #222; color: white; border: 1px solid #444; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .danger { background: #441111; color: #ff5555; }
    </style>
</head>
<body>

<div id="ui">
    <div class="tabs">
        <div class="tab active" id="tab-rig1" onclick="switchRig('rig1')">HUMANOID</div>
        <div class="tab" id="tab-vehicle" onclick="switchRig('rig2')">VEHICLE</div>
    </div>

    <label>Target</label>
    <span id="bone-label">Root</span>

    <div id="pose-controls">
        <label>Swing X</label>
        <div class="control-row"><input type="range" id="rotX-s" min="-3.14" max="3.14" step="0.01"><input type="number" id="rotX-n" step="0.1"></div>
        <label>Swing Z</label>
        <div class="control-row"><input type="range" id="rotZ-s" min="-3.14" max="3.14" step="0.01"><input type="number" id="rotZ-n" step="0.1"></div>
        <label>Twist Y</label>
        <div class="control-row"><input type="range" id="rotY-s" min="-3.14" max="3.14" step="0.01"><input type="number" id="rotY-n" step="0.1"></div>
    </div>

    <div id="box-controls" class="transform-section">
        <label>Offset X / Y / Z</label>
        <div class="control-row"><input type="number" id="posX" step="0.1"> <input type="number" id="posY" step="0.1"> <input type="number" id="posZ" step="0.1"></div>
        <label>Scale W / H / D</label>
        <div class="control-row"><input type="number" id="scaX" step="0.1" value="1"> <input type="number" id="scaY" step="0.1" value="1"> <input type="number" id="scaZ" step="0.1" value="1"></div>
    </div>
    
    <div class="btn-group">
        <button onclick="addBox()" style="background:#1b5e20;">ADD BOX</button>
        <button onclick="deleteSelected()" class="danger">DELETE</button>
    </div>
    
    <button onclick="exportJSON()" style="background:#f9a825; border:none; margin-top:10px; color:black; width:100%;">EXPORT DATA</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';

    const HUMAN_CONFIG = {
        "Root": { p: null, l: 0, d: [0,0,0] },
        "Pelvis": { p: "Root", l: 0, d: [0,0,0], offset: [0, 2.05, 0] },
        "Spine": { p: "Root", l: 0.8, d: [0,1,0], offset: [0, 2.05, 0] },
        "Pelvis_L": { p: "Pelvis", l: 0.3, d: [1,0,0] },
        "Pelvis_R": { p: "Pelvis", l: 0.3, d: [-1,0,0] },
        "Chest": { p: "Spine", l: 0.7, d: [0,1,0] },
        "Neck": { p: "Chest", l: 0.2, d: [0,1,0] },
        "Head": { p: "Neck", l: 0.4, d: [0,1,0] },
        "L_Arm": { p: "Chest", l: 0.7, d: [1,0,0] },
        "L_Forearm": { p: "L_Arm", l: 0.6, d: [1,0,0] },
        "R_Arm": { p: "Chest", l: 0.7, d: [-1,0,0] },
        "R_Forearm": { p: "R_Arm", l: 0.6, d: [-1,0,0] },
        "L_Thigh": { p: "Pelvis_L", l: 1.1, d: [0,-1,0] },
        "L_Calf": { p: "L_Thigh", l: 0.9, d: [0,-1,0] },
        "L_Foot": { p: "L_Calf", l: 0.25, d: [0,0,1] },
        "R_Thigh": { p: "Pelvis_R", l: 1.1, d: [0,-1,0] },
        "R_Calf": { p: "R_Thigh", l: 0.9, d: [0,-1,0] },
        "R_Foot": { p: "R_Calf", l: 0.25, d: [0,0,1] }
    };

    const RIG_DATA = {
        rig1: { pose: {}, boxes: [] },
        rig2: { pose: {}, boxes: [] }
    };

    [RIG_DATA.rig1, RIG_DATA.rig2].forEach(rd => {
        Object.keys(HUMAN_CONFIG).forEach(b => rd.pose[b] = { rot: [0,0,0], pos: [0,0,0], sca: [1,1,1] });
    });

    let currentRig = 'rig1';
    let selectedId = "Root";
    let pivots = {}, clickables = [];

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(5, 3, 7);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.GridHelper(10, 20, 0x333333, 0x222222));

    function syncStructure() {
        const masterBoxes = JSON.parse(JSON.stringify(RIG_DATA.rig1.boxes));
        RIG_DATA.rig2.boxes = masterBoxes;
        masterBoxes.forEach(b => { if(!RIG_DATA.rig2.pose[b.id]) RIG_DATA.rig2.pose[b.id] = {rot:[0,0,0], pos:[0,0,0], sca:[1,1,1]}; });
    }

    window.switchRig = (id) => {
        currentRig = id;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id === 'rig1' ? 'tab-rig1' : 'tab-vehicle').classList.add('active');
        rebuildScene();
    };

    function rebuildScene() {
        while(scene.children.length > 1) scene.remove(scene.children[1]);
        pivots = {}; clickables = [];
        
        Object.keys(HUMAN_CONFIG).forEach(name => {
            const pivot = new THREE.Group();
            pivot.name = name; pivots[name] = pivot;
            const cfg = HUMAN_CONFIG[name];
            const dot = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial());
            pivot.add(dot); dot.userData.id = name; clickables.push(dot);

            if (!cfg.p) scene.add(pivot);
            else {
                const parent = pivots[cfg.p];
                if (cfg.offset) pivot.position.set(...cfg.offset);
                else {
                    const pCfg = HUMAN_CONFIG[cfg.p];
                    pivot.position.set(pCfg.d[0]*pCfg.l, pCfg.d[1]*pCfg.l, pCfg.d[2]*pCfg.l);
                }
                parent.add(pivot);
                if (cfg.l > 0) {
                    const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, cfg.l), new THREE.MeshBasicMaterial({color:0x444444}));
                    bone.position.set(cfg.d[0]*cfg.l/2, cfg.d[1]*cfg.l/2, cfg.d[2]*cfg.l/2);
                    if(cfg.d[0] !== 0) bone.rotation.z = Math.PI/2;
                    else if(cfg.d[2] !== 0) bone.rotation.x = Math.PI/2;
                    pivot.add(bone);
                }
            }
        });

        RIG_DATA[currentRig].boxes.forEach(boxData => {
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshBasicMaterial({wireframe:true}));
            box.userData.id = boxData.id;
            box.userData.isBox = true;
            pivots[boxData.parentId].add(box);
            pivots[boxData.id] = box;
            clickables.push(box);
        });
        updateUI();
    }

    function updateUI() {
        const data = RIG_DATA[currentRig].pose[selectedId];
        document.getElementById('bone-label').innerText = selectedId;
        document.getElementById('box-controls').style.display = selectedId.startsWith("Box_") ? "block" : "none";

        const setVal = (id, val) => {
            const s = document.getElementById(id + '-s');
            const n = document.getElementById(id + '-n');
            if(s) s.value = val; if(n) n.value = Math.round(val * 100) / 100;
        };

        setVal('rotX', data.rot[0]); setVal('rotY', data.rot[1]); setVal('rotZ', data.rot[2]);
        if(selectedId.startsWith("Box_")) {
            ['X','Y','Z'].forEach((axis, i) => {
                document.getElementById('pos'+axis).value = data.pos[i];
                document.getElementById('sca'+axis).value = data.sca[i];
            });
        }

        Object.keys(pivots).forEach(id => {
            const p = pivots[id];
            const d = RIG_DATA[currentRig].pose[id];
            if (p.isGroup) {
                p.quaternion.set(0,0,0,1);
                p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), d.rot[0]));
                p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), d.rot[1]));
                p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), d.rot[2]));
            } else {
                p.rotation.set(...d.rot);
                p.position.set(...d.pos);
                p.scale.set(...d.sca);
            }
            p.traverse(c => { if(c.isMesh) c.material.color.set(id === selectedId ? 0xffff00 : (c.userData.isBox ? 0x00ff88 : 0xffffff)); });
        });
    }

    window.addBox = () => {
        const id = "Box_" + Math.floor(Math.random()*10000);
        RIG_DATA.rig1.boxes.push({ id, parentId: selectedId });
        RIG_DATA.rig1.pose[id] = { rot:[0,0,0], pos:[0,0,0], sca:[1,1,1] };
        syncStructure(); rebuildScene(); selectedId = id; updateUI();
    };

    window.deleteSelected = () => {
        if (!selectedId.startsWith("Box_")) return;
        RIG_DATA.rig1.boxes = RIG_DATA.rig1.boxes.filter(b => b.id !== selectedId);
        syncStructure(); selectedId = "Root"; rebuildScene();
    };

    const inputs = ['rotX','rotY','rotZ','posX','posY','posZ','scaX','scaY','scaZ'];
    inputs.forEach(key => {
        const update = (val, type, axisIndex) => {
            const d = RIG_DATA[currentRig].pose[selectedId];
            if(key.startsWith('rot')) d.rot[axisIndex] = val;
            else if(key.startsWith('pos')) d.pos[axisIndex] = val;
            else if(key.startsWith('sca')) d.sca[axisIndex] = val;
            updateUI();
        };

        const axisMap = {X:0, Y:1, Z:2};
        const axisIdx = axisMap[key.slice(-1)];
        const s = document.getElementById(key+'-s');
        const n = document.getElementById(key+(s?'['-n':key.slice(-1)]')); 
        // Logic for both slider and number box
        if(s) s.oninput = (e) => update(parseFloat(e.target.value), 's', axisIdx);
        const numInput = document.getElementById(s ? key+'-n' : key);
        if(numInput) numInput.oninput = (e) => update(parseFloat(e.target.value) || 0, 'n', axisIdx);
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const hit = raycaster.intersectObjects(clickables)[0];
        if (hit) { selectedId = hit.object.userData.id; updateUI(); }
    });

    rebuildScene();
    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
