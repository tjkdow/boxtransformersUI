<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mecha Lab: Visibility Fix</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        
        #nav-bar { position: absolute; top: 0; width: 100%; display: flex; background: #111; z-index: 300; border-bottom: 1px solid #333; height: 40px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; text-transform: uppercase; color: #666; border-right: 1px solid #222; transition: 0.2s; }
        .tab.active { color: #00ffff; background: #1a1a1a; border-bottom: 2px solid #00ffff; }

        #ui { position: absolute; right: 10px; top: 50px; width: 220px; background: rgba(15, 15, 15, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #444; z-index: 200; }
        #bone-label { font-size: 16px; font-weight: bold; color: #00ffff; display: block; margin-bottom: 10px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 5px;}
        label { display: block; font-size: 10px; color: #888; margin-top: 8px; text-transform: uppercase; }
        input[type=range] { width: 100%; cursor: pointer; margin-bottom: 4px; accent-color: #00ffff; }
        
        button { width: 100%; padding: 8px; cursor: pointer; background: #222; color: white; border: 1px solid #444; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; margin-top: 5px; }
        button:hover { background: #333; }
        
        #timeline-container { position: absolute; bottom: 0; width: 100%; height: 130px; background: #0a0a0a; border-top: 2px solid #333; z-index: 200; }
        #timeline-scrubber { width: 100%; height: 35px; background: #151515; position: relative; border-bottom: 1px solid #333; }
        #playhead { position: absolute; top: 0; width: 2px; height: 100%; background: #ff0055; pointer-events: none; box-shadow: 0 0 8px #ff0055; }
        #frames-list { display: flex; align-items: center; padding: 10px 20px; overflow-x: auto; gap: 12px; height: 85px; }
        
        .frame { min-width: 50px; height: 50px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; flex-shrink: 0; border: 2px solid #333; font-size: 12px; color: #777; }
        .frame.active { border-color: #00ffff; background: #002222; color: #00ffff; }

        #vehicle-footer { position: absolute; bottom: 20px; left: 20px; z-index: 250; }
        .build-btn { padding: 12px 25px; background: #2e7d32; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="nav-bar">
    <div id="tab-v" class="tab active" onclick="changeTab('vehicle')">Vehicle Tab</div>
    <div id="tab-h" class="tab" onclick="changeTab('humanoid')">Humanoid Tab</div>
    <div id="tab-t" class="tab" onclick="changeTab('transform')">Transform Tab</div>
</div>

<div id="ui">
    <div id="pane-humanoid" style="display:none;">
        <label>Active Joint</label>
        <span id="bone-label">Root</span>
        <label>Swing X</label><input type="range" id="rotX" min="-3.14" max="3.14" step="0.01" value="0">
        <label>Swing Z</label><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.01" value="0">
        <label>Local Twist</label><input type="range" id="rotY" min="-3.14" max="3.14" step="0.01" value="0">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:10px;">
            <button onclick="window.mirrorPose('L','R')">L → R</button>
            <button onclick="window.mirrorPose('R','L')">R → L</button>
        </div>
        <button onclick="window.addFrame()" style="background:#1b5e20;">+ NEW FRAME</button>
        <button id="playBtn" onclick="window.togglePlay()" style="background:#0d47a1;">PLAY</button>
    </div>

    <div id="pane-vehicle">
        <label>Part Editor</label>
        <p style="font-size:9px; color:#555;">[W] Move [E] Rotate [R] Scale</p>
        <button onclick="window.deleteBox()" style="background:#b71c1c;">Delete Selected</button>
    </div>

    <div id="pane-transform" style="display:none;">
        <label>Status</label>
        <p style="font-size:10px; color:#555;">Rig mapping active.</p>
    </div>
</div>

<div id="timeline-container" style="display:none;">
    <div id="timeline-scrubber"><div id="playhead"></div></div>
    <div id="frames-list"></div>
</div>

<div id="vehicle-footer">
    <button class="build-btn" onclick="window.addBox()">+ Add Box Part</button>
</div>

<script type="importmap">
    { "imports": { 
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
        "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
        "transform": "https://unpkg.com/three@0.160.0/examples/jsm/controls/TransformControls.js"
    } }
</script>

<script>
    function changeTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tab.charAt(0)).classList.add('active');
        document.getElementById('pane-vehicle').style.display = (tab === 'vehicle') ? 'block' : 'none';
        document.getElementById('pane-humanoid').style.display = (tab === 'humanoid') ? 'block' : 'none';
        document.getElementById('pane-transform').style.display = (tab === 'transform') ? 'block' : 'none';
        document.getElementById('timeline-container').style.display = (tab === 'humanoid') ? 'block' : 'none';
        document.getElementById('vehicle-footer').style.display = (tab === 'vehicle') ? 'block' : 'none';
        if(window.syncTabState) window.syncTabState(tab);
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';
    import { TransformControls } from 'transform';

    const config = {
        "Root": { p: null, l: 0, d: [0,0,0] }, 
        "Pelvis": { p: "Root", l: 0, d: [0,0,0], offset: [0, 2.05, 0] }, 
        "Spine": { p: "Root", l: 0.8, d: [0,1,0], offset: [0, 2.05, 0] }, 
        "Pelvis_L": { p: "Pelvis", l: 0.3, d: [1,0,0] }, "Pelvis_R": { p: "Pelvis", l: 0.3, d: [-1,0,0] },
        "Chest": { p: "Spine", l: 0.7, d: [0,1,0] }, "Neck": { p: "Chest", l: 0.2, d: [0,1,0] }, "Head": { p: "Neck", l: 0.4, d: [0,1,0] },
        "L_Arm": { p: "Chest", l: 0.7, d: [1,0,0] }, "L_Forearm": { p: "L_Arm", l: 0.6, d: [1,0,0] }, "L_Hand": { p: "L_Forearm", l: 0.3, d: [1,0,0] },
        "R_Arm": { p: "Chest", l: 0.7, d: [-1,0,0] }, "R_Forearm": { p: "R_Arm", l: 0.6, d: [-1,0,0] }, "R_Hand": { p: "R_Forearm", l: 0.3, d: [-1,0,0] },
        "L_Thigh": { p: "Pelvis_L", l: 1.1, d: [0,-1,0] }, "L_Calf": { p: "L_Thigh", l: 0.9, d: [0,-1,0] }, "L_Foot": { p: "L_Calf", l: 0.25, d: [0,0,1] }, 
        "R_Thigh": { p: "Pelvis_R", l: 1.1, d: [0,-1,0] }, "R_Calf": { p: "R_Thigh", l: 0.9, d: [0,-1,0] }, "R_Foot": { p: "R_Calf", l: 0.25, d: [0,0,1] }
    };

    let scene, camera, renderer, controls, gizmo;
    let frames = [], currentIdx = 0, selectedBone = "Root", isPlaying = false, currentTab = 'vehicle';
    let boxes = [], activeBox = null;
    const pivots = {}, clickables = [];

    init();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(6, 4, 10);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        controls = new OrbitControls(camera, renderer.domElement);
        gizmo = new TransformControls(camera, renderer.domElement);
        gizmo.addEventListener('dragging-changed', (e) => controls.enabled = !e.value);
        scene.add(gizmo);

        scene.add(new THREE.GridHelper(20, 40, 0x333333, 0x222222));
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dl = new THREE.DirectionalLight(0xffffff, 1.0);
        dl.position.set(10, 20, 10);
        scene.add(dl);

        // Build Rig
        Object.keys(config).forEach(name => {
            const pivot = new THREE.Group();
            pivot.name = name; pivots[name] = pivot;
            const dot = new THREE.Mesh(name === "Root" ? new THREE.CylinderGeometry(0.25,0.25,0.02,32) : new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0xffffff}));
            dot.userData.boneName = name; pivot.add(dot); clickables.push(dot);
            
            if (name === "Root") scene.add(pivot);
            else {
                const pCfg = config[name];
                const parent = pivots[pCfg.p];
                if (pCfg.offset) pivot.position.set(...pCfg.offset);
                else {
                    const parentData = config[pCfg.p];
                    pivot.position.set(parentData.d[0]*parentData.l, parentData.d[1]*parentData.l, parentData.d[2]*parentData.l);
                }
                parent.add(pivot);

                if (pCfg.l > 0) {
                    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,pCfg.l,6), new THREE.MeshBasicMaterial({color:0xcccccc}));
                    cyl.position.set(pCfg.d[0]*pCfg.l/2, pCfg.d[1]*pCfg.l/2, pCfg.d[2]*pCfg.l/2);
                    if(pCfg.d[0] !== 0) cyl.rotation.z = Math.PI/2; else if(pCfg.d[2] !== 0) cyl.rotation.x = Math.PI/2;
                    cyl.userData.boneName = name; pivot.add(cyl); clickables.push(cyl);
                    
                    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.01,0.12,0.04), new THREE.MeshBasicMaterial({color:0x00ffff}));
                    fin.position.copy(cyl.position);
                    if (name.includes("Foot")) fin.position.y += 0.05; else { fin.position.z += 0.05; fin.rotation.x = Math.PI/2; }
                    fin.userData.boneName = name; pivot.add(fin); clickables.push(fin);
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            if (currentTab !== 'vehicle') return;
            const key = e.key.toLowerCase();
            if (key === 'w') gizmo.setMode('translate');
            if (key === 'e') gizmo.setMode('rotate');
            if (key === 'r') gizmo.setMode('scale');
        });

        renderer.domElement.addEventListener('pointerdown', onSelect);
        window.addFrame();
        changeTab('vehicle');
        animate();
    }

    function onSelect(e) {
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const ray = new THREE.Raycaster();
        ray.setFromCamera(mouse, camera);
        if (currentTab === 'vehicle') {
            const hit = ray.intersectObjects(boxes)[0];
            if (hit) setActiveBox(hit.object);
            else if (!gizmo.dragging) setActiveBox(null);
        } else if (currentTab === 'humanoid') {
            const hit = ray.intersectObjects(clickables)[0];
            if (hit) { selectedBone = hit.object.userData.boneName; updateApp(); }
        }
    }

    function setActiveBox(obj) {
        if (activeBox) activeBox.material.emissive.setHex(0x000000);
        activeBox = obj;
        if (activeBox) {
            activeBox.material.emissive.setHex(0x333333);
            gizmo.attach(activeBox);
        } else gizmo.detach();
    }

    window.syncTabState = (tab) => {
        currentTab = tab;
        gizmo.detach();
        updateApp();
    };

    window.addBox = () => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshPhongMaterial({color:0x888888}));
        b.position.set(0, 0.5, 0);
        scene.add(b);
        boxes.push(b);
        setActiveBox(b);
    };

    window.deleteBox = () => {
        if (!activeBox) return;
        gizmo.detach();
        scene.remove(activeBox);
        boxes = boxes.filter(x => x !== activeBox);
        activeBox = null;
    };

    window.addFrame = () => {
        const last = frames[currentIdx] ? JSON.parse(JSON.stringify(frames[currentIdx])) : null;
        frames.push(last || Object.fromEntries(Object.keys(config).map(n => [n, [0,0,0]])));
        currentIdx = frames.length - 1;
        updateApp();
    };

    window.mirrorPose = (f, t) => {
        const p = frames[currentIdx];
        Object.keys(p).forEach(n => {
            let target = n.includes(`_${f}`) ? n.replace(`_${f}`, `_${t}`) : n.startsWith(f + '_') ? n.replace(f + '_', t + '_') : null;
            if (target && p[target]) p[target] = [p[n][0], -p[n][1], -p[n][2]];
        });
        updateApp();
    };

    function updateApp() {
        const pose = frames[currentIdx];
        if(!pose) return;
        
        document.getElementById('bone-label').innerText = selectedBone;
        ['rotX','rotY','rotZ'].forEach((id, i) => {
            const input = document.getElementById(id);
            input.value = pose[selectedBone][i];
            input.oninput = (e) => { frames[currentIdx][selectedBone][i] = parseFloat(e.target.value); updateApp(); };
        });

        Object.keys(pivots).forEach(name => {
            const pivot = pivots[name];
            pivot.visible = (currentTab === 'humanoid' || currentTab === 'transform');
            const [x,y,z] = pose[name];
            const dir = new THREE.Vector3().fromArray(config[name].d).normalize();
            pivot.quaternion.set(0,0,0,1);
            pivot.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), z));
            let sAxis = (Math.abs(dir.y) > 0.5 || name === "Root" || name === "Pelvis" || name === "Spine") ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
            pivot.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(sAxis, x));
            pivot.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(dir.length() === 0 ? new THREE.Vector3(0,1,0) : dir, y));
            
            pivot.traverse(c => { if(c.isMesh && c.geometry.type !== "BoxGeometry") {
                c.material.color.set(name === selectedBone ? 0xffff00 : (name === "Root" ? 0xaa00ff : 0xffffff));
            }});
        });

        boxes.forEach(b => b.visible = (currentTab === 'vehicle' || currentTab === 'transform'));
        
        const list = document.getElementById('frames-list');
        list.innerHTML = '';
        frames.forEach((f, i) => {
            const d = document.createElement('div');
            d.className = `frame ${i === currentIdx ? 'active' : ''}`;
            d.innerText = i + 1;
            d.onclick = () => { currentIdx = i; updateApp(); };
            list.appendChild(d);
        });
        document.getElementById('playhead').style.left = `calc(${(currentIdx/(frames.length-1||1))*100}% - 1px)`;
    }

    window.togglePlay = () => { isPlaying = !isPlaying; document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY"; if(isPlaying) playLoop(); };
    function playLoop() { if(!isPlaying) return; currentIdx = (currentIdx + 1) % frames.length; updateApp(); setTimeout(playLoop, 200); }

    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
</script>
</body>
</html>
