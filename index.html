<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Rig: Stable Master-Clone Architecture</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        #ui { position: absolute; right: 10px; top: 10px; width: 220px; background: rgba(15, 15, 15, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #444; z-index: 100; }
        
        .tabs { display: flex; gap: 2px; margin-bottom: 15px; background: #222; border-radius: 4px; padding: 2px; }
        .tab { flex: 1; padding: 6px; font-size: 9px; text-align: center; cursor: pointer; background: #333; border-radius: 2px; font-weight: bold; }
        .tab.active { background: #00ffff; color: #000; }

        #bone-label { font-size: 14px; font-weight: bold; color: #00ffff; display: block; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        label { display: block; font-size: 10px; color: #888; margin-top: 8px; text-transform: uppercase; }
        input[type=range] { width: 100%; cursor: pointer; margin-bottom: 4px; accent-color: #00ffff; }
        
        .control-group { margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 5px; }
        input[type=number] { width: 100%; background: #111; color: #00ffff; border: 1px solid #444; font-size: 10px; padding: 4px; border-radius: 2px; box-sizing: border-box; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
        button { width: 100%; padding: 8px; cursor: pointer; background: #222; color: white; border: 1px solid #444; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .danger { background: #441111; color: #ff5555; }
    </style>
</head>
<body>

<div id="ui">
    <div class="tabs">
        <div class="tab active" id="tab-rigA" onclick="switchRig('rigA')">HUMAN A</div>
        <div class="tab" id="tab-rigB" onclick="switchRig('rigB')">HUMAN B</div>
        <div class="tab" id="tab-veh" onclick="switchRig('veh')">VEHICLE</div>
    </div>

    <label>Active</label>
    <span id="bone-label">Root</span>

    <label>Swing X</label><input type="range" id="rotX" min="-3.14" max="3.14" step="0.01" value="0">
    <label>Swing Z</label><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.01" value="0">
    <label>Twist Y</label><input type="range" id="rotY" min="-3.14" max="3.14" step="0.01" value="0">

    <div id="armor-ui" style="display:none;" class="control-group">
        <label>Dimensions</label>
        <div class="input-row">
            <input type="number" id="scaX" step="0.1" value="1">
            <input type="number" id="scaY" step="0.1" value="1">
            <input type="number" id="scaZ" step="0.1" value="1">
        </div>
        <label>Offset</label>
        <div class="input-row">
            <input type="number" id="posX" step="0.1" value="0">
            <input type="number" id="posY" step="0.1" value="0">
            <input type="number" id="posZ" step="0.1" value="0">
        </div>
    </div>
    
    <div class="btn-group">
        <button onclick="addBox()" style="background:#1b5e20; border:none;">ADD BOX</button>
        <button onclick="deleteSelected()" class="danger">DELETE</button>
    </div>
    <button onclick="exportJSON()" style="background:#f9a825; border:none; margin-top:10px; color:black; width:100%;">EXPORT CURRENT</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';

    const SKELETON = {
        "Root": { p: null, l: 0, d: [0,0,0] },
        "Pelvis": { p: "Root", l: 0, d: [0,0,0], offset: [0, 2.05, 0] },
        "Spine": { p: "Root", l: 0.8, d: [0,1,0], offset: [0, 2.05, 0] },
        "Chest": { p: "Spine", l: 0.7, d: [0,1,0] },
        "Head": { p: "Chest", l: 0.5, d: [0,1,0] },
        "L_Arm": { p: "Chest", l: 0.7, d: [1,0,0] },
        "R_Arm": { p: "Chest", l: 0.7, d: [-1,0,0] },
        "L_Thigh": { p: "Pelvis", l: 1.1, d: [0.3,-1,0] },
        "R_Thigh": { p: "Pelvis", l: 1.1, d: [-0.3,-1,0] },
        "L_Calf": { p: "L_Thigh", l: 0.9, d: [0,-1,0] },
        "R_Calf": { p: "R_Thigh", l: 0.9, d: [0,-1,0] }
    };

    const DATA = {
        rigA: { pose: {}, armor: [] },
        rigB: { pose: {}, armor: [] },
        veh:  { pose: {}, armor: [] }
    };

    const setupData = (rig) => {
        Object.keys(SKELETON).forEach(b => rig.pose[b] = { rot:[0,0,0], pos:[0,0,0], sca:[1,1,1] });
    };
    setupData(DATA.rigA); setupData(DATA.rigB); setupData(DATA.veh);

    let current = 'rigA', selected = "Root", pivots = {}, clickables = [];
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(5, 3, 7);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    new OrbitControls(camera, renderer.domElement);

    function syncStructure() {
        const boxes = JSON.parse(JSON.stringify(DATA.rigA.armor));
        ['rigB', 'veh'].forEach(key => {
            DATA[key].armor = boxes;
            boxes.forEach(b => { if(!DATA[key].pose[b.id]) DATA[key].pose[b.id] = {rot:[0,0,0], pos:[0,0,0], sca:[1,1,1]}; });
        });
    }

    window.switchRig = (id) => {
        current = id;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${id}`).classList.add('active');
        rebuild();
    };

    function rebuild() {
        while(scene.children.length > 0) scene.remove(scene.children[0]);
        scene.add(new THREE.GridHelper(10, 20, 0x333333, 0x222222));
        pivots = {}; clickables = [];

        Object.keys(SKELETON).forEach(name => {
            const pivot = new THREE.Group();
            pivot.name = name; pivots[name] = pivot;
            const cfg = SKELETON[name];
            const dot = new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshBasicMaterial());
            dot.userData.id = name; pivot.add(dot); clickables.push(dot);

            if (!cfg.p) scene.add(pivot);
            else {
                const parent = pivots[cfg.p];
                if (cfg.offset) pivot.position.set(...cfg.offset);
                else {
                    const pCfg = SKELETON[cfg.p];
                    pivot.position.set(pCfg.d[0]*pCfg.l, pCfg.d[1]*pCfg.l, pCfg.d[2]*pCfg.l);
                }
                parent.add(pivot);
            }
        });

        DATA[current].armor.forEach(b => {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshBasicMaterial({wireframe:true}));
            mesh.userData.id = b.id; mesh.userData.isBox = true;
            pivots[b.parentId].add(mesh); pivots[b.id] = mesh; clickables.push(mesh);
        });
        updateUI();
    }

    function updateUI() {
        const pose = DATA[current].pose[selected];
        document.getElementById('bone-label').innerText = selected;
        document.getElementById('armor-ui').style.display = selected.startsWith("Box") ? "block" : "none";
        
        ['rotX', 'rotY', 'rotZ'].forEach((id, i) => document.getElementById(id).value = pose.rot[i]);
        if(selected.startsWith("Box")) {
            ['X','Y','Z'].forEach((a, i) => {
                document.getElementById('pos'+a).value = pose.pos[i];
                document.getElementById('sca'+a).value = pose.sca[i];
            });
        }

        Object.keys(pivots).forEach(id => {
            const p = pivots[id], d = DATA[current].pose[id];
            p.quaternion.set(0,0,0,1);
            p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), d.rot[0]));
            p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), d.rot[1]));
            p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), d.rot[2]));
            if(p.userData.isBox) { p.position.set(...d.pos); p.scale.set(...d.sca); }
            p.traverse(c => { if(c.isMesh) c.material.color.set(id === selected ? 0xffff00 : (c.userData.isBox ? 0x00ff88 : 0xffffff)); });
        });
    }

    window.addBox = () => {
        if(current !== 'rigA') return alert("Structure changes allowed on Humanoid A only.");
        const id = "Box_" + Math.random().toString(36).substr(2, 4).toUpperCase();
        DATA.rigA.armor.push({ id, parentId: selected });
        DATA.rigA.pose[id] = { rot:[0,0,0], pos:[0,0,0], sca:[1,1,1] };
        syncStructure(); rebuild(); selected = id; updateUI();
    };

    window.deleteSelected = () => {
        if (!selected.startsWith("Box") || current !== 'rigA') return;
        DATA.rigA.armor = DATA.rigA.armor.filter(b => b.id !== selected);
        syncStructure(); selected = "Root"; rebuild();
    };

    const bind = (id, fn) => document.getElementById(id).oninput = (e) => { fn(parseFloat(e.target.value)); updateUI(); };
    bind('rotX', v => DATA[current].pose[selected].rot[0] = v);
    bind('rotY', v => DATA[current].pose[selected].rot[1] = v);
    bind('rotZ', v => DATA[current].pose[selected].rot[2] = v);
    ['X','Y','Z'].forEach((a, i) => {
        bind('pos'+a, v => DATA[current].pose[selected].pos[i] = v);
        bind('sca'+a, v => DATA[current].pose[selected].sca[i] = v);
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
        const m = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const ray = new THREE.Raycaster(); ray.setFromCamera(m, camera);
        const hit = ray.intersectObjects(clickables)[0];
        if (hit) { selected = hit.object.userData.id; updateUI(); }
    });

    rebuild();
    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
