<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mecha Lab: Pure Rig & Vehicle</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        
        #nav-bar { position: absolute; top: 0; width: 100%; display: flex; background: #111; z-index: 200; border-bottom: 1px solid #333; height: 40px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; text-transform: uppercase; color: #666; border-right: 1px solid #222; }
        .tab.active { color: #00ffff; background: #1a1a1a; border-bottom: 2px solid #00ffff; }

        #ui { position: absolute; right: 10px; top: 50px; width: 220px; background: rgba(15, 15, 15, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #444; z-index: 100; }
        #bone-label { font-size: 14px; font-weight: bold; color: #00ffff; display: block; margin-bottom: 10px; text-align: center; border-bottom: 1px solid #333; }
        label { display: block; font-size: 10px; color: #888; margin-top: 8px; text-transform: uppercase; }
        input[type=range] { width: 100%; accent-color: #00ffff; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
        button { width: 100%; padding: 8px; cursor: pointer; background: #222; color: white; border: 1px solid #444; border-radius: 4px; font-size: 10px; font-weight: bold; }
        button:hover { background: #333; }

        #footer { position: absolute; bottom: 20px; left: 20px; z-index: 150; }
        .add-btn { padding: 12px 25px; background: #2e7d32; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="nav-bar">
    <div id="tab-v" class="tab active" onclick="setMode('vehicle')">Vehicle Mode</div>
    <div id="tab-h" class="tab" onclick="setMode('humanoid')">Humanoid Mode</div>
</div>

<div id="ui">
    <div id="pane-humanoid" style="display:none;">
        <span id="bone-label">Root</span>
        <label>Swing X</label><input type="range" id="rotX" min="-3.14" max="3.14" step="0.01" value="0">
        <label>Swing Z</label><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.01" value="0">
        <label>Twist Y</label><input type="range" id="rotY" min="-3.14" max="3.14" step="0.01" value="0">
        <div class="btn-group">
            <button onclick="mirror('L','R')">L → R</button>
            <button onclick="mirror('R','L')">R → L</button>
        </div>
    </div>

    <div id="pane-vehicle">
        <label>Gizmo Keys</label>
        <p style="font-size:9px; color:#666;">W: Move | E: Rotate | R: Scale</p>
        <button onclick="deleteBox()" style="background:#b71c1c; border:none; margin-top:10px;">Delete Selected</button>
    </div>
</div>

<div id="footer">
    <button class="add-btn" id="add-box-btn" onclick="addBox()">+ Add Box Part</button>
</div>

<script type="importmap">
    { "imports": { 
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
        "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
        "transform": "https://unpkg.com/three@0.160.0/examples/jsm/controls/TransformControls.js"
    } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';
    import { TransformControls } from 'transform';

    // Rig Configuration
    const config = {
        "Root": { p: null, l: 0, d: [0,0,0] }, 
        "Pelvis": { p: "Root", l: 0, d: [0,0,0], offset: [0, 2.05, 0] }, 
        "Spine": { p: "Root", l: 0.8, d: [0,1,0], offset: [0, 2.05, 0] }, 
        "Pelvis_L": { p: "Pelvis", l: 0.3, d: [1,0,0] }, "Pelvis_R": { p: "Pelvis", l: 0.3, d: [-1,0,0] },
        "Chest": { p: "Spine", l: 0.7, d: [0,1,0] }, "Neck": { p: "Chest", l: 0.2, d: [0,1,0] }, "Head": { p: "Neck", l: 0.4, d: [0,1,0] },
        "L_Arm": { p: "Chest", l: 0.7, d: [1,0,0] }, "L_Forearm": { p: "L_Arm", l: 0.6, d: [1,0,0] },
        "R_Arm": { p: "Chest", l: 0.7, d: [-1,0,0] }, "R_Forearm": { p: "R_Arm", l: 0.6, d: [-1,0,0] },
        "L_Thigh": { p: "Pelvis_L", l: 1.1, d: [0,-1,0] }, "L_Calf": { p: "L_Thigh", l: 0.9, d: [0,-1,0] },
        "R_Thigh": { p: "Pelvis_R", l: 1.1, d: [0,-1,0] }, "R_Calf": { p: "R_Thigh", l: 0.9, d: [0,-1,0] }
    };

    let scene, camera, renderer, orbit, gizmo;
    let mode = 'vehicle', selectedBone = "Root", activeBox = null;
    let boxes = [], pivots = {}, clickables = [];
    let pose = Object.fromEntries(Object.keys(config).map(k => [k, [0,0,0]]));

    init();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(5, 3, 8);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        orbit = new OrbitControls(camera, renderer.domElement);
        gizmo = new TransformControls(camera, renderer.domElement);
        gizmo.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);
        scene.add(gizmo);

        scene.add(new THREE.GridHelper(20, 40, 0x222222, 0x111111));
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(5, 10, 5);
        scene.add(sun);

        buildRig();
        setupEvents();
        refresh();
        animate();
    }

    function buildRig() {
        Object.keys(config).forEach(name => {
            const pivot = new THREE.Group();
            pivot.name = name; pivots[name] = pivot;
            
            // Joint Marker
            const dot = new THREE.Mesh(
                name === "Root" ? new THREE.CylinderGeometry(0.2,0.2,0.02) : new THREE.SphereGeometry(0.04), 
                new THREE.MeshBasicMaterial({color: 0xffffff})
            );
            dot.userData.bone = name;
            pivot.add(dot); clickables.push(dot);

            if (name === "Root") scene.add(pivot);
            else {
                const c = config[name];
                const parent = pivots[c.p];
                if (c.offset) pivot.position.set(...c.offset);
                else {
                    const pData = config[c.p];
                    pivot.position.set(pData.d[0]*pData.l, pData.d[1]*pData.l, pData.d[2]*pData.l);
                }
                parent.add(pivot);

                // Bone Mesh
                if (c.l > 0) {
                    const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,c.l), new THREE.MeshBasicMaterial({color:0x666666}));
                    bone.position.set(c.d[0]*c.l/2, c.d[1]*c.l/2, c.d[2]*c.l/2);
                    if(c.d[0] !== 0) bone.rotation.z = Math.PI/2;
                    else if(c.d[2] !== 0) bone.rotation.x = Math.PI/2;
                    pivot.add(bone);
                    bone.userData.bone = name; clickables.push(bone);
                }
            }
        });
    }

    function setupEvents() {
        window.addEventListener('keydown', (e) => {
            if (mode !== 'vehicle') return;
            if (e.key.toLowerCase() === 'w') gizmo.setMode('translate');
            if (e.key.toLowerCase() === 'e') gizmo.setMode('rotate');
            if (e.key.toLowerCase() === 'r') gizmo.setMode('scale');
        });

        renderer.domElement.addEventListener('pointerdown', (e) => {
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const ray = new THREE.Raycaster();
            ray.setFromCamera(mouse, camera);

            if (mode === 'vehicle') {
                const hit = ray.intersectObjects(boxes)[0];
                selectBox(hit ? hit.object : null);
            } else {
                const hit = ray.intersectObjects(clickables)[0];
                if (hit) { selectedBone = hit.object.userData.bone; refresh(); }
            }
        });

        ['rotX','rotY','rotZ'].forEach((id, i) => {
            document.getElementById(id).oninput = (e) => {
                pose[selectedBone][i] = parseFloat(e.target.value);
                refresh();
            };
        });
    }

    function selectBox(mesh) {
        if (activeBox) activeBox.material.emissive.setHex(0x000000);
        activeBox = mesh;
        if (activeBox) {
            activeBox.material.emissive.setHex(0x333333);
            gizmo.attach(activeBox);
        } else {
            gizmo.detach();
        }
    }

    window.setMode = (m) => {
        mode = m;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + m.charAt(0)).classList.add('active');
        document.getElementById('pane-humanoid').style.display = (m === 'humanoid' ? 'block' : 'none');
        document.getElementById('pane-vehicle').style.display = (m === 'vehicle' ? 'block' : 'none');
        document.getElementById('add-box-btn').style.display = (m === 'vehicle' ? 'block' : 'none');
        gizmo.detach();
        refresh();
    };

    window.addBox = () => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshPhongMaterial({color: 0x888888}));
        b.position.y = 0.5;
        scene.add(b);
        boxes.push(b);
        selectBox(b);
    };

    window.deleteBox = () => {
        if (!activeBox) return;
        scene.remove(activeBox);
        boxes = boxes.filter(x => x !== activeBox);
        selectBox(null);
    };

    window.mirror = (f, t) => {
        Object.keys(pose).forEach(n => {
            let target = n.includes(`_${f}`) ? n.replace(`_${f}`, `_${t}`) : n.startsWith(f + '_') ? n.replace(f + '_', t + '_') : null;
            if (target && pose[target]) pose[target] = [pose[n][0], -pose[n][1], -pose[n][2]];
        });
        refresh();
    };

    function refresh() {
        document.getElementById('bone-label').innerText = selectedBone;
        ['rotX','rotY','rotZ'].forEach((id, i) => document.getElementById(id).value = pose[selectedBone][i]);

        Object.keys(pivots).forEach(name => {
            const piv = pivots[name];
            const [x,y,z] = pose[name];
            const d = new THREE.Vector3(...config[name].d).normalize();
            
            piv.quaternion.set(0,0,0,1);
            piv.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), z));
            let sAxis = (Math.abs(d.y) > 0.5 || name === "Root" || name === "Pelvis" || name === "Spine") ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
            piv.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(sAxis, x));
            piv.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(d.length() === 0 ? new THREE.Vector3(0,1,0) : d, y));

            piv.traverse(c => {
                if(c.isMesh && c.userData.bone) {
                    c.material.color.set(name === selectedBone ? 0xffff00 : (name === "Root" ? 0xaa00ff : 0xffffff));
                }
            });
        });
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
</script>
</body>
</html>
