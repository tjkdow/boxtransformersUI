<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mecha Lab: Prototyping Suite</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Consolas', monospace; overflow: hidden; touch-action: none; user-select: none; }
        #nav-bar { position: absolute; top: 0; width: 100%; display: flex; background: #111; z-index: 200; border-bottom: 1px solid #00ffff; height: 40px; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; text-transform: uppercase; color: #666; transition: 0.2s; border-right: 1px solid #222; }
        .tab.active { color: #00ffff; background: #1a1a1a; box-shadow: inset 0 -2px 0 #00ffff; }

        #ui { position: absolute; right: 10px; top: 50px; width: 240px; background: rgba(5, 5, 5, 0.9); padding: 15px; border: 1px solid #333; z-index: 100; backdrop-filter: blur(5px); }
        .section-label { font-size: 10px; color: #00ffff; margin-top: 15px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        #bone-label { font-size: 12px; font-weight: bold; color: #ffff00; display: block; margin-bottom: 10px; text-align: center; border: 1px dashed #444; padding: 5px; }
        
        label { display: block; font-size: 9px; color: #aaa; margin-top: 8px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #00ffff; height: 4px; }
        input[type=number] { background: #000; border: 1px solid #444; color: #00ffff; width: 50px; font-size: 10px; padding: 2px; text-align: center; }
        
        .row { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
        button { flex: 1; padding: 8px; cursor: pointer; background: #222; color: white; border: 1px solid #444; font-size: 9px; text-transform: uppercase; }
        button:hover { background: #333; border-color: #00ffff; }
        .active-tool { background: #004d40; border-color: #00ffff; }
        
        #footer { position: absolute; bottom: 20px; left: 20px; z-index: 150; display: flex; gap: 10px; }
        .btn-main { padding: 10px 15px; background: #006064; color: white; border: 1px solid #00ffff; cursor: pointer; text-transform: uppercase; font-size: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="nav-bar">
    <div id="tab-vehicle" class="tab active" onclick="changeTab('vehicle')">Vehicle Modeler</div>
    <div id="tab-humanoid" class="tab" onclick="changeTab('humanoid')">Humanoid Rigging</div>
</div>

<div id="ui">
    <div id="bone-label">EMPTY SELECTION</div>
    
    <div id="rig-controls">
        <div class="section-label">Joint Rotation</div>
        <label>Flex / Extend (X)</label><input type="range" id="rotX" min="-3.14" max="3.14" step="0.01" value="0">
        <label>Side Tilt (Z)</label><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.01" value="0">
        <label>Torsion / Twist (Y)</label><input type="range" id="rotY" min="-3.14" max="3.14" step="0.01" value="0">
    </div>
    
    <div class="section-label">Transform Control</div>
    <div class="row">
        <button id="btn-translate" class="active-tool" onclick="setGizmoMode('translate')">Move</button>
        <button id="btn-rotate" onclick="setGizmoMode('rotate')">Rotate</button>
    </div>
    <div class="row">
        <input type="number" id="px" step="0.1"> <input type="number" id="py" step="0.1"> <input type="number" id="pz" step="0.1">
    </div>
    <button onclick="window.deleteActive()" style="background:#400; margin-top:20px; width:100%; border-color:#f00;">DELETE SELECTED</button>
</div>

<div id="footer">
    <button id="footer-veh-box" class="btn-main" onclick="window.addBox(false)">+ Scenery Box</button>
    <button id="footer-rig-box" class="btn-main hidden" onclick="window.addBox(true)">+ Armor Part</button>
    <button id="footer-rig-skeleton" class="btn-main hidden" style="background:#311b92;" onclick="window.spawnSubRig()">+ New Skeleton</button>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
            "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
            "gizmo": "https://unpkg.com/three@0.160.0/examples/jsm/controls/TransformControls.js"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';
    import { TransformControls } from 'gizmo';

    // STREAMLINED SKELETON: Direct Pelvis -> Thigh connection
    const SKELETON = {
        "Root": { p: null, l: 0, d: [0,0,0] }, 
        "Pelvis": { p: "Root", l: 0, d: [0,0,0], off: [0, 1.8, 0] }, 
        "Spine": { p: "Pelvis", l: 0.6, d: [0,1,0] }, 
        "Chest": { p: "Spine", l: 0.5, d: [0,1,0] }, 
        "Head": { p: "Chest", l: 0.4, d: [0,1,0], off: [0, 0.6, 0] },
        "L_Shoulder": { p: "Chest", l: 0.5, d: [1,0,0] }, "L_Elbow": { p: "L_Shoulder", l: 0.5, d: [1,0,0] },
        "R_Shoulder": { p: "Chest", l: 0.5, d: [-1,0,0] }, "R_Elbow": { p: "R_Shoulder", l: 0.5, d: [-1,0,0] },
        
        // Thighs now split left/right natively from Pelvis origin offset
        "L_Thigh": { p: "Pelvis", l: 0.9, d: [0,-1,0], off: [0.25, 0, 0] },
        "L_Knee": { p: "L_Thigh", l: 0.8, d: [0,-1,0] },
        
        "R_Thigh": { p: "Pelvis", l: 0.9, d: [0,-1,0], off: [-0.25, 0, 0] },
        "R_Knee": { p: "R_Thigh", l: 0.8, d: [0,-1,0] }
    };

    let curTab = 'vehicle', activeObj = null, activeRig = null, activeJointName = null;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 500);
    camera.position.set(8, 5, 8);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    const orbit = new OrbitControls(camera, renderer.domElement);
    const gizmo = new TransformControls(camera, renderer.domElement);
    scene.add(new THREE.GridHelper(20, 20, 0x00ffff, 0x111111));
    scene.add(gizmo);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dL = new THREE.DirectionalLight(0xffffff, 0.8); dL.position.set(5,10,5); scene.add(dL);

    const vehicleBoxes = [], subRigs = [];
    let masterRig = null;

    class RigSkeleton {
        constructor(isMaster = false) {
            this.isMaster = isMaster;
            this.group = new THREE.Group();
            this.pivots = {};
            this.joints = {};
            this.pose = {};
            
            Object.keys(SKELETON).forEach(name => {
                this.pose[name] = [0,0,0];
                const pivot = new THREE.Group();
                this.pivots[name] = pivot;
                const cfg = SKELETON[name];
                
                const joint = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 1), new THREE.MeshBasicMaterial({color: 0x00ffff}));
                joint.userData = { type: 'bone', name, rig: this };
                pivot.add(joint);
                this.joints[name] = joint;

                if (!cfg.p) this.group.add(pivot);
                else {
                    const parentP = this.pivots[cfg.p];
                    if (cfg.off) pivot.position.set(...cfg.off);
                    else {
                        const pCfg = SKELETON[cfg.p];
                        pivot.position.set(pCfg.d[0]*pCfg.l, pCfg.d[1]*pCfg.l, pCfg.d[2]*pCfg.l);
                    }
                    parentP.add(pivot);
                    
                    if (cfg.l > 0) {
                        const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.03, cfg.l, 6), new THREE.MeshStandardMaterial({color: 0x444444}));
                        bone.position.set(cfg.d[0]*cfg.l/2, cfg.d[1]*cfg.l/2, cfg.d[2]*cfg.l/2);
                        const dir = new THREE.Vector3().fromArray(cfg.d).normalize();
                        bone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
                        pivot.add(bone);
                    }
                }
            });
            scene.add(this.group);
            if (!isMaster) subRigs.push(this);
        }

        update() {
            Object.keys(this.pivots).forEach(name => {
                const p = this.pivots[name];
                const [rx, rz, ry] = this.pose[name];
                const d = new THREE.Vector3().fromArray(SKELETON[name].d).normalize();
                p.quaternion.set(0,0,0,1);
                p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), rz));
                let flexAxis = (Math.abs(d.y)>0.5 || name==="Root" || name==="Pelvis") ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
                p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(flexAxis, rx));
                p.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(d.length()===0?new THREE.Vector3(0,1,0):d, ry));
                this.joints[name].material.color.set((this === activeRig && name === activeJointName) ? 0xffff00 : 0x00ffff);
            });
        }
    }

    masterRig = new RigSkeleton(true);

    window.addBox = (parented) => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), new THREE.MeshStandardMaterial({color: 0x333333}));
        b.userData = { type: 'box', parented: parented };
        
        if (parented && activeRig && activeJointName) {
            activeRig.pivots[activeJointName].add(b);
        } else {
            scene.add(b);
            if (!parented) vehicleBoxes.push(b);
        }
        select(b);
    };

    window.spawnSubRig = () => {
        const r = new RigSkeleton(false);
        r.group.position.set(Math.random()*2, 0, Math.random()*2);
        select(r.joints["Pelvis"]);
    };

    function select(obj) {
        if (activeObj && activeObj.userData.type === 'box') activeObj.material.emissive.setHex(0x000000);
        activeObj = obj;
        
        if (!obj) {
            gizmo.detach(); activeJointName = null; activeRig = null;
            document.getElementById('bone-label').innerText = "EMPTY SELECTION";
            document.getElementById('rig-controls').classList.add('hidden');
            return;
        }

        if (obj.userData.type === 'box') {
            gizmo.attach(obj);
            obj.material.emissive.setHex(0x003333);
            activeRig = null; activeJointName = obj.userData.parented ? "ARMOR PIECE" : "VEHICLE PART";
            document.getElementById('rig-controls').classList.add('hidden');
        } else if (obj.userData.type === 'bone') {
            activeRig = obj.userData.rig;
            activeJointName = obj.userData.name;
            gizmo.attach(activeRig.group);
            document.getElementById('rig-controls').classList.remove('hidden');

            const p = activeRig.pose[activeJointName];
            document.getElementById('rotX').value = p[0];
            document.getElementById('rotZ').value = p[1];
            document.getElementById('rotY').value = p[2];
        }
        document.getElementById('bone-label').innerText = activeJointName;
        syncUI();
    }

    function syncUI() {
        if (!activeObj) return;
        const target = (activeObj.userData.type === 'bone') ? activeObj.userData.rig.group : activeObj;
        document.getElementById('px').value = target.position.x.toFixed(2);
        document.getElementById('py').value = target.position.y.toFixed(2);
        document.getElementById('pz').value = target.position.z.toFixed(2);
    }

    ['px','py','pz'].forEach((id, i) => {
        document.getElementById(id).addEventListener('input', (e) => {
            if (!activeObj) return;
            const target = (activeObj.userData.type === 'bone') ? activeObj.userData.rig.group : activeObj;
            target.position[['x','y','z'][i]] = parseFloat(e.target.value) || 0;
        });
    });

    ['rotX', 'rotZ', 'rotY'].forEach((id, i) => {
        document.getElementById(id).oninput = (e) => {
            if (activeRig && activeJointName) {
                activeRig.pose[activeJointName][i] = parseFloat(e.target.value);
            }
        };
    });

    gizmo.addEventListener('change', syncUI);
    gizmo.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);

    window.setGizmoMode = (m) => gizmo.setMode(m);

    window.changeTab = (t) => {
        curTab = t;
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        
        // UI Button Switch management
        document.getElementById('footer-veh-box').classList.toggle('hidden', t !== 'vehicle');
        document.getElementById('footer-rig-box').classList.toggle('hidden', t !== 'humanoid');
        document.getElementById('footer-rig-skeleton').classList.toggle('hidden', t !== 'humanoid');

        // Target visibility bounds
        masterRig.group.visible = (t === 'humanoid');
        subRigs.forEach(r => r.group.visible = (t === 'humanoid'));
        vehicleBoxes.forEach(b => b.visible = (t === 'vehicle'));
        
        select(null);
    };

    window.deleteActive = () => {
        if (!activeObj || activeObj.userData.rig?.isMaster) return;
        if (activeObj.userData.type === 'box') {
            if (activeObj.parent !== scene) activeObj.parent.remove(activeObj);
            else {
                vehicleBoxes.splice(vehicleBoxes.indexOf(activeObj), 1);
                scene.remove(activeObj);
            }
        } else {
            subRigs.splice(subRigs.indexOf(activeObj.userData.rig), 1);
            scene.remove(activeObj.userData.rig.group);
        }
        select(null);
    };

    renderer.domElement.addEventListener('pointerdown', (e) => {
        if (gizmo.dragging) return;
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const ray = new THREE.Raycaster(); ray.setFromCamera(mouse, camera);
        
        const pool = [];
        scene.traverse(child => { if(child.userData.type && child.visible) pool.push(child); });
        
        const hits = ray.intersectObjects(pool);
        if (hits.length > 0) select(hits[0].object);
        else select(null);
    });

    function animate() { 
        requestAnimationFrame(animate); 
        masterRig.update();
        subRigs.forEach(r => r.update());
        renderer.render(scene, camera); 
    }
    animate();
    changeTab('vehicle');
</script>
</body>
</html>
